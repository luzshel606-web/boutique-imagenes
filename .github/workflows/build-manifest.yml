name: Generar manifest de imágenes

on:
  push:
    paths:
      - 'imagenes/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar imagenes.json
        run: |
          python3 - <<'EOF'
          import os, json
          carpeta = "imagenes"
          extensiones = (".jpg", ".jpeg", ".png", ".webp", ".gif", ".avif")
          archivos = sorted([n for n in os.listdir(carpeta) if n.lower().endswith(extensiones)])
          with open("imagenes.json", "w", encoding="utf-8") as f:
              json.dump(archivos, f, ensure_ascii=False, indent=2)
          EOF

      - name: Commit imagenes.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add imagenes.json
          git diff --cached --quiet || git commit -m "🖼️ Actualizar manifest"
          git push
